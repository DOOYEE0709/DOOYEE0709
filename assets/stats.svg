<svg width="450" height="190" viewBox="0 0 450 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId">
  <title id="titleId">DOOYEE&apos;s GitHub Stats</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e67e22; }
    .label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2c3e50; }
    .value { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2c3e50; }
  </style>
  <defs>
    <linearGradient id="gradient" gradientTransform="rotate(45)" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" rx="20" width="449" height="189" stroke="#e4e2e2" fill="url(#gradient)"/>
  <text class="header" x="25" y="35">DOOYEE&apos;s GitHub Stats</text>
  <g transform="translate(0, 62)">
    <g transform="translate(25, 0)">
      <text class="label" x="0" y="9">⭐</text>
      <text class="label" x="30" y="9">Total Stars</text>
      <text class="value" x="400" y="9" text-anchor="end">1</text>
    </g>
    <g transform="translate(25, 25)">
      <text class="label" x="0" y="9">➕</text>
      <text class="label" x="30" y="9">Total Commits</text>
      <text class="value" x="400" y="9" text-anchor="end">1,434</text>
    </g>
    <g transform="translate(25, 50)">
      <text class="label" x="0" y="9">🔀</text>
      <text class="label" x="30" y="9">Total PRs</text>
      <text class="value" x="400" y="9" text-anchor="end">142</text>
    </g>
    <g transform="translate(25, 75)">
      <text class="label" x="0" y="9">🚩</text>
      <text class="label" x="30" y="9">Total Issues</text>
      <text class="value" x="400" y="9" text-anchor="end">92</text>
    </g>
    <g transform="translate(25, 100)">
      <text class="label" x="0" y="9">📦</text>
      <text class="label" x="30" y="9">Contributed to</text>
      <text class="value" x="400" y="9" text-anchor="end">21</text>
    </g>
  </g>
</svg>
